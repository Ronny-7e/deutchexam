const DAILY_BANK_30 = [
  // 10 Adjektive
  { de: 'wichtig', fr: 'important', cat: 'Adjektiv', example: 'Pünktlichkeit ist in Deutschland sehr wichtig.' },
  { de: 'günstig', fr: 'avantageux / bon marché', cat: 'Adjektiv', example: 'Wir suchen eine günstige Wohnung in der Stadt.' },
  { de: 'zufrieden', fr: 'satisfait', cat: 'Adjektiv', example: 'Ich bin mit meinem Deutschkurs sehr zufrieden.' },
  { de: 'freundlich', fr: 'aimable / chaleureux', cat: 'Adjektiv', example: 'Die Prüfer sind sehr freundlich und hilfsbereit.' },
  { de: 'möglich', fr: 'possible', cat: 'Adjektiv', example: 'Ist es möglich, den Termin auf morgen zu verschieben?' },
  { de: 'unterschiedlich', fr: 'différent / varié', cat: 'Adjektiv', example: 'Wir haben sehr unterschiedliche Meinungen.' },
  { de: 'praktisch', fr: 'pratique', cat: 'Adjektiv', example: 'Das Fahrrad ist sehr praktisch in der Stadt.' },
  { de: 'notwendig', fr: 'nécessaire', cat: 'Adjektiv', example: 'Ein B1-Zertifikat ist für die Einbürgerung notwendig.' },
  { de: 'berühmt', fr: 'célèbre', cat: 'Adjektiv', example: 'Berlin ist berühmt für seine Museen und Kultur.' },
  { de: 'selbstständig', fr: 'autonome / indépendant', cat: 'Adjektiv', example: 'Ich kann jetzt selbstständig Formulare ausfüllen.' },

  // 10 Verben
  { de: 'bestehen', fr: 'réussir (un examen)', cat: 'Verb', example: 'Ich möchte die B1-Prüfung im ersten Versuch bestehen.' },
  { de: 'sich vorbereiten', fr: 'se préparer', cat: 'Verb', example: 'Ich bereite mich jeden Tag auf die mündliche Prüfung vor.' },
  { de: 'vorschlagen', fr: 'proposer', cat: 'Verb', example: 'Ich schlage vor, dass wir uns am Samstag um 10 Uhr treffen.' },
  { de: 'sich entscheiden', fr: 'se décider / choisir', cat: 'Verb', example: 'Ich habe mich für einen Intensivkurs entschieden.' },
  { de: 'vergleichen', fr: 'comparer', cat: 'Verb', example: 'Man sollte die verschiedenen Angebote genau vergleichen.' },
  { de: 'verbessern', fr: 'améliorer', cat: 'Verb', example: 'Ich möchte meine Aussprache und Grammatik verbessern.' },
  { de: 'teilnehmen', fr: 'participer à', cat: 'Verb', example: 'Wir nehmen am Wochenende an einer Konferenz teil.' },
  { de: 'sich bewerben', fr: 'postuler', cat: 'Verb', example: 'Ich habe mich um eine neue Arbeitsstelle beworben.' },
  { de: 'empfehlen', fr: 'recommander', cat: 'Verb', example: 'Können Sie mir ein gutes deutsches Buch empfehlen?' },
  { de: 'sich gewöhnen', fr: 's\'habituer', cat: 'Verb', example: 'Ich habe mich schnell an das Leben hier gewöhnt.' },

  // 10 Nomen (avec article et pluriel)
  { de: 'die Erfahrung', fr: 'l\'expérience', cat: 'Nomen', plural: 'die Erfahrungen', example: 'Auslandsreisen bringen sehr viel wertvolle Erfahrung.' },
  { de: 'der Vorteil', fr: 'l\'avantage', cat: 'Nomen', plural: 'die Vorteile', example: 'Ein großer Vorteil ist die zentrale Lage der Wohnung.' },
  { de: 'die Meinung', fr: 'l\'avis / l\'opinion', cat: 'Nomen', plural: 'die Meinungen', example: 'Meiner Meinung nach sollten wir mehr Deutsch sprechen.' },
  { de: 'das Ergebnis', fr: 'le résultat', cat: 'Nomen', plural: 'die Ergebnisse', example: 'Das Prüfungsergebnis wird in zwei Wochen bekanntgegeben.' },
  { de: 'die Veranstaltung', fr: 'l\'événement / manifestation', cat: 'Nomen', plural: 'die Veranstaltungen', example: 'Die Kulturveranstaltung findet im Stadtzentrum statt.' },
  { de: 'der Vorschlag', fr: 'la proposition', cat: 'Nomen', plural: 'die Vorschläge', example: 'Das ist ein hervorragender Vorschlag!' },
  { de: 'die Ausbildung', fr: 'la formation professionnelle', cat: 'Nomen', plural: 'die Ausbildungen', example: 'Nach der Schule hat er eine Ausbildung zum Koch begonnen.' },
  { de: 'das Ziel', fr: 'l\'objectif / le but', cat: 'Nomen', plural: 'die Ziele', example: 'Mein wichtigstes Ziel ist das B1-Zertifikat.' },
  { de: 'die Lösung', fr: 'la solution', cat: 'Nomen', plural: 'die Lösungen', example: 'Gemeinsam finden wir sicher eine gute Lösung.' },
  { de: 'der Unterschied', fr: 'la différence', cat: 'Nomen', plural: 'die Unterschiede', example: 'Es gibt einen deutlichen Unterschied zwischen den Optionen.' },
];

/* ═══════════════════════════════════════════
   VOCABULARY TAB
═══════════════════════════════════════════ */
function VocabTab({ apiKey }) {
  const [notebook, setNotebook] = useState(() => db.get(K.NOTEBOOK, []));
  const [discoverList, setDiscoverList] = useState(() => DAILY_BANK_30);
  const [view, setView]         = useState('discover'); // discover | notebook | review | add
  const [filter, setFilter]     = useState('all');
  const [search, setSearch]     = useState('');
  const [expanded, setExpanded] = useState({});
  const [form, setForm]         = useState({ de:'', fr:'', cat:'Verb', plural:'', example:'' });
  const [genBusy, setGenBusy]   = useState(false);
  const [toast, setToast]       = useState(null);

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  };

  const saveNotebook = useCallback(nb => {
    setNotebook(nb);
    db.set(K.NOTEBOOK, nb);
  }, []);

  const today = new Date().toDateString();

  // Spaced review list
  const dailySugg = useMemo(() =>
    notebook
      .filter(w => w.lastReviewed !== today)
      .sort((a,b) => (a.reviewCount||0) - (b.reviewCount||0))
      .slice(0, 15),
    [notebook, today]
  );

  const catCls = cat => {
    const c = (cat || '').toLowerCase();
    if (c.startsWith('verb')) return 'bg-green-100 text-green-700';
    if (c.startsWith('adj'))  return 'bg-blue-100 text-blue-700';
    if (c.startsWith('nom'))  return 'bg-purple-100 text-purple-700';
    return 'bg-orange-100 text-orange-700';
  };

  // 1-Click Toggle for notebook
  const toggleNotebookWord = word => {
    const exists = notebook.some(w => (w.de || '').trim().toLowerCase() === (word.de || '').trim().toLowerCase());
    if (exists) {
      const updated = notebook.filter(w => (w.de || '').trim().toLowerCase() !== (word.de || '').trim().toLowerCase());
      saveNotebook(updated);
      showToast(`« ${word.de} » retiré du bloc-notes`);
    } else {
      const newWord = {
        id: uid(),
        de: word.de.trim(),
        fr: word.fr ? word.fr.trim() : '',
        cat: word.cat || 'Nomen',
        plural: word.plural || '',
        example: word.example || '',
        addedAt: Date.now(),
        reviewCount: 0,
        source: word.source || 'daily_bank',
        lastReviewed: null,
      };
      saveNotebook([newWord, ...notebook]);
      showToast(`✅ « ${word.de} » ajouté au bloc-notes !`);
    }
  };

  // Add all words from current view
  const addAllToNotebook = listToAdd => {
    const existing = new Set(notebook.map(w => (w.de || '').toLowerCase()));
    const fresh = listToAdd
      .filter(w => !existing.has((w.de || '').toLowerCase()))
      .map(w => ({
        id: uid(),
        de: w.de.trim(),
        fr: w.fr || '',
        cat: w.cat || 'Nomen',
        plural: w.plural || '',
        example: w.example || '',
        addedAt: Date.now(),
        reviewCount: 0,
        source: 'daily_bank_batch',
        lastReviewed: null,
      }));
    if (fresh.length > 0) {
      saveNotebook([...fresh, ...notebook]);
      showToast(`🎉 ${fresh.length} mots ajoutés au bloc-notes !`);
    } else {
      showToast('Tous ces mots sont déjà dans votre bloc-notes !');
    }
  };

  const markReviewed = id => {
    saveNotebook(notebook.map(w => w.id === id ? { ...w, lastReviewed: today, reviewCount: (w.reviewCount||0) + 1 } : w));
    showToast('✓ Mot marqué comme révisé');
  };

  const deleteWord = id => {
    saveNotebook(notebook.filter(w => w.id !== id));
    showToast('Mot supprimé');
  };

  const addManualWord = () => {
    if (!form.de.trim() || !form.fr.trim()) return;
    const w = {
      ...form,
      id: uid(),
      addedAt: Date.now(),
      reviewCount: 0,
      source: 'manual',
      lastReviewed: null,
    };
    saveNotebook([w, ...notebook]);
    setForm({ de:'', fr:'', cat:'Verb', plural:'', example:'' });
    showToast(`✅ « ${w.de} » ajouté au bloc-notes !`);
    setView('notebook');
  };

  // Generate with AI
  const generateWithAI = async () => {
    if (!apiKey) {
      alert('Veuillez d\'abord configurer votre clé API dans Profil.');
      return;
    }
    setGenBusy(true);
    try {
      const existing = notebook.slice(-15).map(w => w.de).join(', ');
      const prompt = `Génère exactement 10 mots de vocabulaire allemand indispensables pour le Goethe-Zertifikat B1.
Mélange Adjektive, Verben et Nomen.
Thèmes du quotidien ou examen (logement, travail, santé, environnement).
Ne répète pas ces mots: ${existing || 'aucun'}.
Réponds UNIQUEMENT par un tableau JSON valide au format:
[
  {"de":"die Erfahrung","fr":"l'expérience","cat":"Nomen","plural":"die Erfahrungen","example":"Ich habe viel Erfahrung gesammelt."},
  {"de":"vorschlagen","fr":"proposer","cat":"Verb","example":"Ich schlage vor, dass wir ins Kino gehen."},
  {"de":"günstig","fr":"avantageux","cat":"Adjektiv","example":"Das Ticket ist sehr günstig."}
]`;

      const result = await gemini(apiKey, 'Tu es un enseignant certifié d\'allemand B1.', [], prompt, { json: true, temperature: 0.9 });
      if (Array.isArray(result) && result.length > 0) {
        setDiscoverList(result);
        setView('discover');
        showToast('✨ 10 nouveaux mots générés par l\'IA !');
      } else {
        showToast('Erreur de format de réponse IA.');
      }
    } catch (e) {
      alert('Erreur IA : ' + e.message);
    } finally {
      setGenBusy(false);
    }
  };

  // Filtered lists
  const currentList = view === 'discover' ? discoverList : notebook;
  const filtered = useMemo(() => {
    let list = [...currentList];
    if (filter !== 'all') {
      list = list.filter(w => (w.cat || '').toLowerCase().startsWith(filter));
    }
    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter(w => (w.de || '').toLowerCase().includes(q) || (w.fr || '').toLowerCase().includes(q));
    }
    return list;
  }, [currentList, filter, search]);

  return (
    <div className="pb-28 fade-in relative">
      {/* Toast Notification */}
      {toast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-gray-900/90 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg backdrop-blur-sm fade-in flex items-center gap-2">
          <span>{toast}</span>
        </div>
      )}

      {/* Sub-tabs Navigation */}
      <div className="bg-white border-b sticky top-0 z-10 shadow-sm">
        <div className="flex overflow-x-auto">
          {[
            { k: 'discover', l: `✨ Découvrir (30)` },
            { k: 'notebook', l: `📔 Mon Bloc-notes (${notebook.length})` },
            { k: 'review',   l: `🔔 Révision (${dailySugg.length})` },
            { k: 'add',      l: '✍️ Ajouter' },
          ].map(v => (
            <button
              key={v.k}
              onClick={() => { setView(v.k); setSearch(''); setFilter('all'); }}
              className={`flex-1 py-3 px-2 text-xs font-bold border-b-2 whitespace-nowrap transition-colors ${
                view === v.k ? 'border-orange-500 text-orange-600 bg-orange-50/40' : 'border-transparent text-gray-500 hover:text-gray-800'
              }`}
            >
              {v.l}
            </button>
          ))}
        </div>
      </div>

      {/* ── 1. DÉCOUVRIR (30 MOTS DU JOUR + IA) ── */}
      {view === 'discover' && (
        <div className="p-4">
          <div className="gradient-bg rounded-2xl p-4 text-white mb-4 shadow-sm relative overflow-hidden">
            <div className="flex items-center justify-between gap-2">
              <div>
                <p className="text-xs uppercase tracking-wider font-extrabold text-amber-100">Générateur B1</p>
                <h2 className="text-lg font-extrabold mt-0.5">30 Mots Quotidiens</h2>
                <p className="text-xs opacity-90 mt-0.5">Cliquez sur « ➕ Ajouter au bloc-notes » pour enregistrer chaque mot !</p>
              </div>
              <button
                onClick={() => addAllToNotebook(filtered)}
                className="bg-white text-orange-600 font-extrabold text-xs px-3 py-2 rounded-xl shadow shrink-0 hover:bg-orange-50 transition-colors"
              >
                + Tout ajouter
              </button>
            </div>

            <div className="flex gap-2 mt-3 pt-3 border-t border-white/20">
              <button
                onClick={() => { setDiscoverList(DAILY_BANK_30); showToast('30 mots du jour rechargés !'); }}
                className="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition-colors"
              >
                🔄 30 mots standards
              </button>
              <button
                onClick={generateWithAI}
                disabled={genBusy}
                className="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition-colors disabled:opacity-50"
              >
                {genBusy ? '⏳ Génération IA…' : '🤖 10 mots IA inédits'}
              </button>
            </div>
          </div>

          {/* Search + Category chips */}
          <div className="relative mb-3">
            <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
            <input
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Rechercher en allemand ou français…"
              className="w-full card pl-10 pr-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-300 border border-gray-100"
            />
          </div>

          <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
            {[
              ['all', 'Tous (' + discoverList.length + ')'],
              ['adj', '🔵 Adjektive'],
              ['verb', '🟢 Verben'],
              ['nom', '🟣 Nomen'],
            ].map(([k, l]) => (
              <button
                key={k}
                onClick={() => setFilter(k)}
                className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors ${
                  filter === k ? 'gradient-bg text-white shadow' : 'card text-gray-600 hover:bg-gray-50'
                }`}
              >
                {l}
              </button>
            ))}
          </div>

          {/* Word list */}
          <div className="space-y-2.5">
            {filtered.map((w, idx) => {
              const isSaved = notebook.some(n => (n.de || '').trim().toLowerCase() === (w.de || '').trim().toLowerCase());
              const key = `disc-${idx}-${w.de}`;
              const isExp = expanded[key];

              return (
                <div key={key} className="card p-3.5 border border-gray-100 transition-all hover:shadow-md">
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                        <span className={`tag ${catCls(w.cat)}`}>{w.cat}</span>
                        {w.plural && <span className="text-xs text-gray-400">Pl: {w.plural}</span>}
                      </div>
                      <p className="font-extrabold text-gray-900 text-base">{w.de}</p>
                      <p className="text-sm text-gray-600 font-medium">{w.fr}</p>
                    </div>

                    {/* Prominent 1-click add button */}
                    <button
                      type="button"
                      onClick={() => toggleNotebookWord(w)}
                      className={`shrink-0 px-3 py-2 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition-all shadow-sm ${
                        isSaved
                          ? 'bg-green-100 text-green-700 hover:bg-green-200'
                          : 'gradient-bg text-white hover:opacity-90 active:scale-95'
                      }`}
                    >
                      {isSaved ? (
                        <><span>✓</span><span>Dans le bloc-notes</span></>
                      ) : (
                        <><span>➕</span><span>Ajouter au bloc-notes</span></>
                      )}
                    </button>
                  </div>

                  {w.example && (
                    <div className="mt-2.5 pt-2 border-t border-gray-100">
                      <button
                        onClick={() => setExpanded(p => ({ ...p, [key]: !p[key] }))}
                        className="text-xs text-gray-500 font-semibold hover:text-orange-600 flex items-center gap-1"
                      >
                        <span>{isExp ? '▴ Masquer exemple' : '▾ Voir exemple en phrase'}</span>
                      </button>
                      {isExp && (
                        <div className="mt-1.5 bg-gray-50 rounded-xl p-2.5 text-xs text-gray-800 italic fade-in border border-gray-100">
                          « {w.example} »
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── 2. MON BLOC-NOTES (MOTS SAUVEGARDÉS) ── */}
      {view === 'notebook' && (
        <div className="p-4">
          <div className="flex items-center justify-between mb-3">
            <div>
              <h2 className="text-base font-extrabold text-gray-900">📔 Mon Bloc-notes personnel</h2>
              <p className="text-xs text-gray-500">Tous vos mots sauvegardés (ne sont jamais perdus)</p>
            </div>
            <span className="text-xs font-bold text-orange-600 bg-orange-50 px-2.5 py-1 rounded-full border border-orange-200">
              {notebook.length} mot{notebook.length > 1 ? 's' : ''}
            </span>
          </div>

          {/* Search + Filter */}
          <div className="relative mb-3">
            <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
            <input
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Rechercher dans mon bloc-notes…"
              className="w-full card pl-10 pr-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-300 border border-gray-100"
            />
          </div>

          <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
            {[
              ['all', 'Tous'],
              ['verb', 'Verben'],
              ['adj', 'Adjektive'],
              ['nom', 'Nomen'],
            ].map(([k, l]) => (
              <button
                key={k}
                onClick={() => setFilter(k)}
                className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors ${
                  filter === k ? 'gradient-bg text-white shadow' : 'card text-gray-600 hover:bg-gray-50'
                }`}
              >
                {l}
              </button>
            ))}
          </div>

          {filtered.length === 0 ? (
            <div className="text-center py-16 card p-6">
              <p className="text-5xl mb-3">📔</p>
              <p className="text-gray-800 font-extrabold text-base">Aucun mot dans le bloc-notes</p>
              <p className="text-gray-500 text-xs mt-1 max-w-xs mx-auto">
                Allez dans l'onglet <strong>« ✨ Découvrir »</strong> et cliquez sur <strong>« ➕ Ajouter au bloc-notes »</strong> pour constituer votre liste !
              </p>
              <button
                onClick={() => setView('discover')}
                className="gradient-bg text-white font-extrabold text-xs px-5 py-2.5 rounded-full mt-4 shadow"
              >
                Découvrir les 30 mots du jour →
              </button>
            </div>
          ) : (
            <div className="space-y-2.5">
              {filtered.map(w => (
                <div key={w.id} className="card p-3.5 border border-gray-100">
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                        <span className={`tag ${catCls(w.cat)}`}>{w.cat}</span>
                        {w.plural && <span className="text-xs text-gray-400">Pl: {w.plural}</span>}
                        {w.lastReviewed === today && (
                          <span className="tag bg-green-50 text-green-700 border border-green-200">✓ Révisé aujourd'hui</span>
                        )}
                        {(w.reviewCount || 0) > 0 && (
                          <span className="text-[11px] text-gray-400">Revu {w.reviewCount}x</span>
                        )}
                      </div>
                      <p className="font-extrabold text-gray-900 text-base">{w.de}</p>
                      <p className="text-sm text-gray-600 font-medium">{w.fr}</p>
                    </div>

                    <div className="flex items-center gap-1.5 shrink-0">
                      <button
                        onClick={() => markReviewed(w.id)}
                        className={`text-xs font-bold px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition-colors ${
                          w.lastReviewed === today
                            ? 'bg-green-50 text-green-700'
                            : 'bg-gray-100 hover:bg-green-100 text-gray-700 hover:text-green-800'
                        }`}
                        title="Marquer comme révisé aujourd'hui"
                      >
                        ✓
                      </button>
                      <button
                        onClick={() => deleteWord(w.id)}
                        className="text-xs bg-red-50 hover:bg-red-100 text-red-500 font-bold px-2.5 py-1.5 rounded-lg transition-colors"
                        title="Retirer du bloc-notes"
                      >
                        🗑️
                      </button>
                    </div>
                  </div>

                  {w.example && (
                    <div className="mt-2 pt-2 border-t border-gray-100 text-xs text-gray-700 italic">
                      « {w.example} »
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* ── 3. RÉVISION DU JOUR ── */}
      {view === 'review' && (
        <div className="p-4">
          <div className="flex items-center justify-between mb-3">
            <div>
              <h2 className="text-base font-extrabold text-gray-900">🔔 Révision quotidienne</h2>
              <p className="text-xs text-gray-500">Mots de votre bloc-notes à réviser aujourd'hui</p>
            </div>
            <span className="tag bg-orange-100 text-orange-700 font-bold">{dailySugg.length} restants</span>
          </div>

          {dailySugg.length === 0 ? (
            <div className="text-center py-16 card p-6">
              <p className="text-5xl mb-2">🎉</p>
              <p className="text-gray-900 font-extrabold text-base">Toutes vos révisions sont faites !</p>
              <p className="text-gray-500 text-xs mt-1">Revenez demain ou ajoutez de nouveaux mots pour continuer.</p>
            </div>
          ) : (
            <div className="space-y-3">
              {dailySugg.map(w => (
                <div key={w.id} className="card p-4 border border-gray-100 flex items-start gap-3 shadow-sm">
                  <div className="flex-1 min-w-0">
                    <span className={`tag ${catCls(w.cat)} mb-1`}>{w.cat}</span>
                    <p className="font-extrabold text-gray-900 text-xl mt-1">{w.de}</p>
                    <p className="text-gray-700 font-medium text-sm mt-0.5">{w.fr}</p>
                    {w.plural && <p className="text-xs text-gray-400 mt-0.5">Pluriel: {w.plural}</p>}
                    {w.example && <p className="text-xs text-gray-500 mt-2 italic bg-gray-50 p-2 rounded-lg">« {w.example} »</p>}
                  </div>
                  <button
                    onClick={() => markReviewed(w.id)}
                    className="w-12 h-12 rounded-full gradient-bg text-white font-extrabold text-xl flex items-center justify-center hover:opacity-90 shadow shrink-0"
                    title="Je connais ce mot"
                  >
                    ✓
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* ── 4. AJOUT MANUEL ── */}
      {view === 'add' && (
        <div className="p-4">
          <h2 className="text-base font-extrabold text-gray-900 mb-3">✍️ Ajouter un mot manuellement</h2>
          <div className="card p-4 space-y-3 border border-gray-100">
            <div>
              <label className="text-xs font-bold text-gray-700 block mb-1">Mot ou expression en allemand *</label>
              <input
                value={form.de}
                onChange={e => setForm(p => ({ ...p, de: e.target.value }))}
                placeholder="z.B. der Termin / teilnehmen"
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-orange-400"
              />
            </div>
            <div>
              <label className="text-xs font-bold text-gray-700 block mb-1">Traduction en français *</label>
              <input
                value={form.fr}
                onChange={e => setForm(p => ({ ...p, fr: e.target.value }))}
                placeholder="ex: le rendez-vous / participer"
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-orange-400"
              />
            </div>
            <div>
              <label className="text-xs font-bold text-gray-700 block mb-1">Catégorie</label>
              <select
                value={form.cat}
                onChange={e => setForm(p => ({ ...p, cat: e.target.value }))}
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none"
              >
                {['Verb', 'Adjektiv', 'Nomen', 'Expression'].map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            {form.cat === 'Nomen' && (
              <div>
                <label className="text-xs font-bold text-gray-700 block mb-1">Forme du pluriel (optionnel)</label>
                <input
                  value={form.plural}
                  onChange={e => setForm(p => ({ ...p, plural: e.target.value }))}
                  placeholder="die Termine"
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-orange-400"
                />
              </div>
            )}
            <div>
              <label className="text-xs font-bold text-gray-700 block mb-1">Phrase d'exemple (optionnel)</label>
              <textarea
                value={form.example}
                onChange={e => setForm(p => ({ ...p, example: e.target.value }))}
                placeholder="Ich habe morgen einen Termin beim Arzt."
                rows={2}
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-orange-400 resize-none"
              />
            </div>
            <button
              onClick={addManualWord}
              disabled={!form.de.trim() || !form.fr.trim()}
              className="gradient-bg w-full text-white font-extrabold py-3 rounded-xl text-sm disabled:opacity-50 shadow-md"
            >
              ➕ Ajouter directement au bloc-notes
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   EXAM TOPICS TAB
═══════════════════════════════════════════ */
function TopicsTab({ apiKey, onVocabExtracted }) {
  const [topics, setTopics] = useState(() => db.get(K.TOPICS, []));
  const [showForm, setShowForm] = useState(false);
  const [form, setForm]   = useState({ title:'', text:'', type:'Lesen' });
  const [analyzing, setAnalyzing] = useState(null);
  const [practicing, setPracticing] = useState(null);
  const [expanded, setExpanded] = useState({});
  const [uploadedFiles, setUploadedFiles] = useState([]);
  const [ocrBusy, setOcrBusy] = useState(false);
  const fileUploadRef = useRef(null);

  const saveTopics = t => { setTopics(t); db.set(K.TOPICS, t); };

  /* Handle file upload (images, PDFs, text files) from phone or computer */
  const handleFileUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    
    const newFiles = [];
    for (const file of files) {
      const type = file.type;
      if (type.startsWith('image/')) {
        /* Image: convert to base64 for preview + OCR via Gemini */
        const b64 = await blobToBase64(file);
        newFiles.push({ name: file.name, type: 'image', mimeType: type, base64: b64, preview: URL.createObjectURL(file) });
      } else if (type === 'application/pdf') {
        /* PDF: store reference for display */
        newFiles.push({ name: file.name, type: 'pdf', mimeType: type, preview: null });
        /* Can't directly read PDF text in browser, suggest taking screenshot */
      } else if (type.startsWith('text/') || file.name.endsWith('.txt') || file.name.endsWith('.md')) {
        /* Text file: read content directly */
        const text = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsText(file);
        });
        setForm(prev => ({ ...prev, text: prev.text ? prev.text + '\n\n' + text : text, title: prev.title || file.name.replace(/\.[^.]+$/, '') }));
      }
    }
    setUploadedFiles(prev => [...prev, ...newFiles]);
    if (e.target) e.target.value = '';
  };

  /* Extract text from uploaded images using Gemini Vision */
  const extractTextFromImages = async () => {
    if (!apiKey) { alert("Configurez votre clé API d'abord."); return; }
    const images = uploadedFiles.filter(f => f.type === 'image');
    if (!images.length) return;
    
    setOcrBusy(true);
    try {
      for (const img of images) {
        const contents = [{
          role: 'user',
          parts: [
            { inlineData: { mimeType: img.mimeType, data: img.base64 } },
            { text: "Extrais tout le texte visible dans cette image. S'il s'agit d'un sujet d'examen ou d'un texte en allemand, transcris-le fidèlement. Retourne uniquement le texte extrait, sans commentaire." }
          ]
        }];

        let lastErr = null;
        let extractedText = '';
        for (const model of GEMINI_MODELS) {
          try {
            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
              { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents }) }
            );
            const data = await res.json();
            if (data.error) { lastErr = new Error(data.error.message); continue; }
            extractedText = data.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
            break;
          } catch (e) { lastErr = e; }
        }
        
        if (extractedText) {
          setForm(prev => ({
            ...prev,
            text: prev.text ? prev.text + '\n\n--- Image: ' + img.name + ' ---\n' + extractedText : extractedText,
            title: prev.title || img.name.replace(/\.[^.]+$/, ''),
          }));
        } else if (lastErr) {
          alert("Erreur d'extraction du texte de " + img.name + ' : ' + lastErr.message);
        }
      }
    } catch (e) {
      alert("Erreur lors de l'extraction : " + e.message);
    } finally {
      setOcrBusy(false);
    }
  };

  const removeFile = (idx) => {
    setUploadedFiles(prev => prev.filter((_, i) => i !== idx));
  };

  const addTopic = () => {
    if (!form.title.trim() || !form.text.trim()) return;
    saveTopics([...topics, { id: uid(), ...form, addedAt: Date.now(), analyzed: false }]);
    setForm({ title:'', text:'', type:'Lesen' });
    setShowForm(false);
  };

  const analyze = async topic => {
    if (!apiKey) { alert('Configurez votre clé API d\'abord.'); return; }
    setAnalyzing(topic.id);
    try {
      const prompt = `Analyse ce texte ou sujet d'examen allemand B1 et retourne un objet JSON:
{
  "vocab": [{"de":"...","fr":"...","cat":"Verb|Adjektiv|Nomen","example":"..."}],
  "grammar": ["point de grammaire 1","point 2"],
  "keyPhrases": ["expression utile 1","expression 2"],
  "questions": ["Question de compréhension 1?","Question 2?","Question 3?"],
  "summary": "résumé du thème en 1 phrase en français"
}
Texte/Sujet: """${topic.text}"""
Extrais 8 à 12 mots de vocabulaire clés. Réponds UNIQUEMENT en JSON valide.`;

      const result = await gemini(apiKey, 'Tu es un expert certifié en didactique de l\'allemand et préparation Goethe B1.', [], prompt, { json: true });
      const updated = topics.map(t => t.id===topic.id ? { ...t, analyzed:true, ...result } : t);
      saveTopics(updated);
      if (result.vocab?.length) {
        onVocabExtracted(result.vocab.map(w => ({ ...w, id:uid(), addedAt:Date.now(), reviewCount:0, source:'exam', lastReviewed:null })));
      }
    } catch(e) { alert('Erreur analyse : ' + e.message); }
    finally { setAnalyzing(null); }
  };

  const deleteTopic = id => saveTopics(topics.filter(t => t.id !== id));

  // Practicing on a topic = special chat
  if (practicing) {
    const part = {
      id: 99, emoji: '📝', grad: 'from-indigo-400 to-purple-500',
      title: practicing.title, sub: practicing.type,
      greeting: practicing.questions?.[0]
        ? `Guten Tag! Wir üben heute zum Thema „${practicing.title}". Meine erste Frage: ${practicing.questions[0]}`
        : `Guten Tag! Wir üben heute zum Thema „${practicing.title}". Was kannst du mir dazu sagen?`,
      system: `Du bist Anna, eine B1-Prüfungspartnerin.
Thema der Übung: "${practicing.title}" (${practicing.type}).
Inhalt: "${practicing.text.slice(0,600)}"
${practicing.keyPhrases?.length ? `Wichtige Ausdrücke: ${practicing.keyPhrases.join(', ')}` : ''}

Stelle Fragen zu diesem Thema, bitte um Meinungen und Reaktionen.
Sei aufmunternd. Verwende B1-Deutsch.

ANTWORTFORMAT:
[PARTNER]
Deine Reaktion / Folgefrage auf Deutsch…
[/PARTNER]
[FEEDBACK]
{"grammar":"...","suggestion":"...","score":7,"strengths":["..."],"improvements":["..."]}
[/FEEDBACK]`,
    };
    return (
      <ChatInterface
        part={part} apiKey={apiKey}
        onBack={() => setPracticing(null)}
        onSessionEnd={s => { const sessions = db.get(K.SESSIONS,[]); db.set(K.SESSIONS,[...sessions,s]); setPracticing(null); }}
      />
    );
  }

  return (
    <div className="pb-28 fade-in">
      <div className="bg-white border-b sticky top-0 z-10 px-4 py-3 flex items-center justify-between">
        <div>
          <h1 className="text-base font-extrabold text-gray-900">📝 Sujets d'examen</h1>
          <p className="text-xs text-gray-500">L'IA analyse vos textes · extrait vocabulaire + exercices</p>
        </div>
        <button onClick={()=>setShowForm(v=>!v)} className={`px-4 py-2 rounded-xl text-sm font-bold ${showForm?'bg-gray-100 text-gray-700':'gradient-bg text-white shadow'}`}>
          {showForm ? '← Retour' : '+ Ajouter'}
        </button>
      </div>

      {showForm ? (
        <div className="p-4">
          <div className="card p-4 space-y-3">
            <div>
              <label className="text-xs font-semibold text-gray-500 block mb-1">Titre *</label>
              <input value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))} placeholder="ex: Texte sur l'environnement" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-orange-400" />
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-500 block mb-1">Type de compétence</label>
              <select value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))} className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none">
                {['Lesen','Hören','Sprechen','Schreiben'].map(t=><option key={t}>{t}</option>)}
              </select>
            </div>

            {/* FILE UPLOAD — Photos, PDF, Text files from phone or computer */}
            <div>
              <label className="text-xs font-semibold text-gray-500 block mb-1">📎 Importer un fichier (photo, PDF, texte)</label>
              <p className="text-[11px] text-gray-400 mb-2">Prenez en photo un sujet d'examen ou importez un fichier depuis votre téléphone / ordinateur</p>
              
              <input
                ref={fileUploadRef}
                type="file"
                accept="image/*,application/pdf,.txt,.md,.doc,.docx"
                multiple
                capture="environment"
                onChange={handleFileUpload}
                className="hidden"
              />

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => {
                    /* On mobile: trigger camera directly */
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.capture = 'environment';
                    input.onchange = handleFileUpload;
                    input.click();
                  }}
                  className="flex-1 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 font-bold text-xs py-2.5 rounded-xl flex items-center justify-center gap-1.5 transition-colors"
                >
                  <span>📷</span> Prendre une photo
                </button>
                <button
                  type="button"
                  onClick={() => fileUploadRef.current?.click()}
                  className="flex-1 bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-700 font-bold text-xs py-2.5 rounded-xl flex items-center justify-center gap-1.5 transition-colors"
                >
                  <span>📁</span> Parcourir les fichiers
                </button>
              </div>

              {/* Uploaded files preview */}
              {uploadedFiles.length > 0 && (
                <div className="mt-2 space-y-2">
                  {uploadedFiles.map((f, idx) => (
                    <div key={idx} className="bg-gray-50 rounded-xl p-2 flex items-center gap-2 border border-gray-100">
                      {f.type === 'image' && f.preview && (
                        <img src={f.preview} alt={f.name} className="w-12 h-12 rounded-lg object-cover shrink-0" />
                      )}
                      {f.type === 'pdf' && (
                        <div className="w-12 h-12 rounded-lg bg-red-100 flex items-center justify-center text-red-600 text-lg shrink-0">📄</div>
                      )}
                      <div className="flex-1 min-w-0">
                        <p className="text-xs font-bold text-gray-800 truncate">{f.name}</p>
                        <p className="text-[11px] text-gray-400">{f.type === 'image' ? '🖼️ Image' : '📄 PDF'}</p>
                      </div>
                      <button
                        onClick={() => removeFile(idx)}
                        className="text-gray-400 hover:text-red-500 text-sm shrink-0 p-1"
                      >✕</button>
                    </div>
                  ))}
                  
                  {/* Extract text from images button */}
                  {uploadedFiles.some(f => f.type === 'image') && (
                    <button
                      type="button"
                      onClick={extractTextFromImages}
                      disabled={ocrBusy}
                      className="w-full bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-extrabold text-xs py-2.5 rounded-xl flex items-center justify-center gap-1.5 transition-colors disabled:opacity-50 border border-indigo-200"
                    >
                      {ocrBusy ? (
                        <><span className="animate-spin">⏳</span> Extraction du texte en cours…</>
                      ) : (
                        <><span>🤖</span> Extraire le texte des images avec l'IA</>
                      )}
                    </button>
                  )}
                </div>
              )}
            </div>

            <div>
              <label className="text-xs font-semibold text-gray-500 block mb-1">Texte / Notes / Sujet *</label>
              <textarea value={form.text} onChange={e=>setForm(p=>({...p,text:e.target.value}))}
                placeholder={"Collez ici votre texte d'examen, un résumé de cours, ou les thèmes à maîtriser…\n\nOu utilisez les boutons ci-dessus pour importer depuis une photo / fichier 📷"}
                rows={8} className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-orange-400 resize-none" />
            </div>
            <button onClick={addTopic} disabled={!form.title.trim()||!form.text.trim()} className="gradient-bg w-full text-white font-bold py-3 rounded-xl text-sm disabled:opacity-50">
              💾 Sauvegarder
            </button>
          </div>
        </div>
      ) : (
        <div className="p-4">
          {topics.length===0
            ? <div className="text-center py-16">
                <p className="text-5xl mb-3">📄</p>
                <p className="text-gray-700 font-bold">Aucun sujet ajouté</p>
                <p className="text-gray-400 text-sm mt-1 max-w-xs mx-auto">Collez vos textes d'examen pour que l'IA les analyse et génère des exercices.</p>
              </div>
            : <div className="space-y-3">
                {topics.map(t => (
                  <div key={t.id} className="card p-4">
                    <div className="flex items-start gap-3 mb-3">
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 mb-1 flex-wrap">
                          <span className="tag bg-indigo-100 text-indigo-700">{t.type}</span>
                          {t.analyzed && <span className="tag bg-green-100 text-green-700">✓ Analysé</span>}
                        </div>
                        <p className="font-bold text-gray-900">{t.title}</p>
                        <p className="text-xs text-gray-400 mt-0.5 line-clamp-2">{t.text.slice(0,100)}…</p>
                      </div>
                      <button onClick={()=>deleteTopic(t.id)} className="text-gray-300 hover:text-red-400 text-xl leading-none shrink-0">×</button>
                    </div>

                    {t.analyzed && (
                      <div className="space-y-2 mb-3">
                        {t.summary && <p className="text-xs font-medium text-gray-600 bg-gray-50 rounded-lg p-2">📌 {t.summary}</p>}
                        {t.grammar?.length>0 && (
                          <details className="bg-blue-50 rounded-lg">
                            <summary className="text-xs font-bold text-blue-700 px-3 py-2 cursor-pointer">📐 Grammaire ({t.grammar.length} points)</summary>
                            <div className="px-3 pb-2 space-y-0.5">{t.grammar.map((g,i)=><p key={i} className="text-xs text-blue-600">• {g}</p>)}</div>
                          </details>
                        )}
                        {t.keyPhrases?.length>0 && (
                          <details className="bg-orange-50 rounded-lg">
                            <summary className="text-xs font-bold text-orange-700 px-3 py-2 cursor-pointer">💬 Expressions clés ({t.keyPhrases.length})</summary>
                            <div className="px-3 pb-2 flex flex-wrap gap-1">{t.keyPhrases.map((p,i)=><span key={i} className="tag bg-orange-100 text-orange-700">{p}</span>)}</div>
                          </details>
                        )}
                        {t.questions?.length>0 && (
                          <details className="bg-purple-50 rounded-lg">
                            <summary className="text-xs font-bold text-purple-700 px-3 py-2 cursor-pointer">❓ Questions ({t.questions.length})</summary>
                            <div className="px-3 pb-2 space-y-0.5">{t.questions.map((q,i)=><p key={i} className="text-xs text-purple-600">• {q}</p>)}</div>
                          </details>
                        )}
                        {t.vocab?.length>0 && (
                          <details className="bg-emerald-50 rounded-lg border border-emerald-200">
                            <summary className="text-xs font-bold text-emerald-800 px-3 py-2 cursor-pointer flex items-center justify-between">
                              <span>📔 Vocabulaire clé extrait ({t.vocab.length} mots)</span>
                              <span className="text-[10px] font-normal text-emerald-600">Ouvrir ▾</span>
                            </summary>
                            <div className="px-3 pb-2.5 pt-1 space-y-2">
                              {t.vocab.map((v, idx) => {
                                const currentNotebook = db.get(K.NOTEBOOK, []);
                                const isSaved = currentNotebook.some(w => (w.de || '').toLowerCase() === (v.de || '').toLowerCase());
                                return (
                                  <div key={idx} className="bg-white p-2.5 rounded-xl border border-emerald-100 flex items-center justify-between gap-2 shadow-xs">
                                    <div className="flex-1 min-w-0">
                                      <p className="font-bold text-xs text-gray-900">{v.de}</p>
                                      <p className="text-[11px] text-gray-600 truncate">{v.fr}</p>
                                    </div>
                                    <button
                                      type="button"
                                      onClick={() => {
                                        const nb = db.get(K.NOTEBOOK, []);
                                        if (!nb.some(w => (w.de || '').toLowerCase() === (v.de || '').toLowerCase())) {
                                          db.set(K.NOTEBOOK, [{ ...v, id: uid(), addedAt: Date.now(), reviewCount: 0, source: 'exam' }, ...nb]);
                                          saveTopics([...topics]);
                                        }
                                      }}
                                      className={`text-[11px] font-extrabold px-2.5 py-1.5 rounded-lg shrink-0 transition-colors ${
                                        isSaved ? 'bg-green-100 text-green-700' : 'gradient-bg text-white shadow-xs'
                                      }`}
                                    >
                                      {isSaved ? '✓ Au bloc-notes' : '➕ Ajouter'}
                                    </button>
                                  </div>
                                );
                              })}
                            </div>
                          </details>
                        )}
                      </div>
                    )}

                    <div className="flex gap-2">
                      {!t.analyzed && (
                        <button onClick={()=>analyze(t)} disabled={analyzing===t.id} className="flex-1 gradient-bg text-white text-xs font-bold py-2.5 rounded-xl disabled:opacity-60">
                          {analyzing===t.id ? '⏳ Analyse…' : '🤖 Analyser avec l\'IA'}
                        </button>
                      )}
                      <button onClick={()=>setPracticing(t)} className="flex-1 bg-indigo-100 text-indigo-700 text-xs font-bold py-2.5 rounded-xl hover:bg-indigo-200 transition-colors">
                        🎙️ S'entraîner
                      </button>
                    </div>
                  </div>
                ))}
              </div>
          }
        </div>
      )}
    </div>
  );
}

function ProfileTab({ apiKey, onResetKey }) {
  const sessions  = db.get(K.SESSIONS, []);
  const notebook  = db.get(K.NOTEBOOK, []);
  const topics    = db.get(K.TOPICS, []);
  const today     = new Date().toDateString();
  const fileInputRef = useRef(null);

  const exportData = () => {
    const backup = {
      version: 1,
      date: new Date().toISOString(),
      apiKey: db.get(K.API, ''),
      notebook: db.get(K.NOTEBOOK, []),
      sessions: db.get(K.SESSIONS, []),
      topics: db.get(K.TOPICS, []),
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `deutsch_b1_sauvegarde_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = JSON.parse(event.target.result);
        if (data.notebook && Array.isArray(data.notebook)) {
          db.set(K.NOTEBOOK, data.notebook);
          if (data.sessions && Array.isArray(data.sessions)) db.set(K.SESSIONS, data.sessions);
          if (data.topics && Array.isArray(data.topics)) db.set(K.TOPICS, data.topics);
          if (data.apiKey && typeof data.apiKey === 'string' && !db.get(K.API, '')) {
            db.set(K.API, data.apiKey);
          }
          alert(`✅ Importation réussie ! ${data.notebook.length} mots et ${data.sessions?.length || 0} sessions restaurés.`);
          window.location.reload();
        } else {
          alert('❌ Fichier invalide : format de sauvegarde non reconnu.');
        }
      } catch (err) {
        alert('❌ Erreur de lecture du fichier : ' + err.message);
      }
    };
    reader.readAsText(file);
  };

  const totalSessions = sessions.length;
  const avgScore = totalSessions ? sessions.reduce((a,b)=>a+b.score,0)/totalSessions : 0;
  const totalWords    = notebook.length;
  const reviewedToday = notebook.filter(w=>w.lastReviewed===today).length;

  /* Streak */
  const streak = useMemo(() => {
    const dates = new Set([
      ...sessions.map(s=>new Date(s.date).toDateString()),
      ...notebook.filter(w=>w.lastReviewed).map(w=>w.lastReviewed),
    ]);
    let c=0, d=new Date();
    while(dates.has(d.toDateString())) { c++; d.setDate(d.getDate()-1); }
    return c;
  }, [sessions, notebook]);

  /* Readiness score */
  const readiness = useMemo(() => {
    const sc = Math.min((avgScore/10)*35, 35);
    const vc = Math.min((totalWords/250)*30, 30);
    const ec = Math.min((totalSessions/15)*25, 25);
    const tc = Math.min((topics.filter(t=>t.analyzed).length/5)*10, 10);
    return Math.round(sc+vc+ec+tc);
  }, [avgScore, totalWords, totalSessions, topics]);

  const rGrad  = readiness>=70?'from-green-400 to-teal-500':readiness>=40?'from-yellow-400 to-orange-500':'from-red-400 to-pink-500';
  const rLabel = readiness>=70?'✅ Bien préparé(e)':readiness>=40?'📈 En bonne progression':'🔴 Travail nécessaire';

  /* Weaknesses analysis */
  const insights = [];
  if (totalSessions === 0) insights.push({ type:'warn', msg:'Aucune session orale — lancez votre premier Sprechen !' });
  else if (avgScore < 6) insights.push({ type:'warn', msg:`Score moyen ${avgScore.toFixed(1)}/10 — continuez à pratiquer l'oral.` });
  else if (avgScore >= 8) insights.push({ type:'ok', msg:`Excellent score moyen (${avgScore.toFixed(1)}/10) — gardez ce rythme !` });

  const partScores = PARTS.map(p => {
    const ps = sessions.filter(s=>s.partId===p.id);
    return { ...p, n: ps.length, avg: ps.length ? ps.reduce((a,b)=>a+b.score,0)/ps.length : null };
  });
  partScores.forEach(p => {
    if (!p.n) insights.push({ type:'warn', msg:`Teil ${p.id} (${p.title}) jamais pratiqué.` });
    else if (p.avg < 5) insights.push({ type:'warn', msg:`Teil ${p.id} faible (${p.avg.toFixed(1)}/10) — à renforcer.` });
  });

  if (totalWords < 100) insights.push({ type:'warn', msg:`Seulement ${totalWords} mots — visez 200+ pour B1.` });
  if (streak >= 5) insights.push({ type:'ok', msg:`🔥 ${streak} jours de suite — incroyable régularité !` });
  if (streak === 0) insights.push({ type:'warn', msg:'Aucune activité aujourd\'hui — même 10 minutes aide !' });

  return (
    <div className="p-4 pb-28 fade-in">
      {/* Card */}
      <div className="card p-5 mb-4 text-center relative overflow-hidden">
        <div className="absolute inset-0 gradient-bg opacity-5" />
        <div className="relative">
          <div className="w-20 h-20 rounded-full gradient-bg flex items-center justify-center text-4xl mx-auto mb-3 shadow-lg">👤</div>
          <h2 className="text-xl font-extrabold text-gray-900">Rony</h2>
          <div className="flex justify-center gap-2 mt-2">
            <span className="tag bg-orange-100 text-orange-700 text-sm">A2 → B1</span>
            <span className="tag bg-gray-100 text-gray-600 text-sm">📅 24 Nov 2026</span>
          </div>
          {apiKey && (
            <button onClick={onResetKey} className="mt-3 text-xs text-gray-400 underline hover:text-gray-600">
              Changer de clé API
            </button>
          )}
        </div>
      </div>

      {/* Readiness */}
      <div className="card p-4 mb-4">
        <h3 className="font-bold text-gray-800 mb-3">🎯 Préparation globale</h3>
        <div className="flex items-center gap-4 mb-3">
          <div className={`w-20 h-20 rounded-full bg-gradient-to-br ${rGrad} flex items-center justify-center text-white font-extrabold text-2xl shrink-0 shadow-lg`}>
            {readiness}%
          </div>
          <div>
            <p className="font-bold text-gray-800">{rLabel}</p>
            <p className="text-xs text-gray-400 mt-0.5">Sessions · Scores · Vocabulaire · Sujets</p>
          </div>
        </div>
        <div className="h-3 bg-gray-100 rounded-full overflow-hidden">
          <div className={`h-full bg-gradient-to-r ${rGrad} rounded-full transition-all duration-700`} style={{ width:`${readiness}%` }} />
        </div>

        {insights.length>0 && (
          <div className="mt-3 space-y-1.5">
            {insights.map((ins,i) => (
              <div key={i} className={`flex items-start gap-2 text-xs p-2 rounded-lg ${ins.type==='ok'?'bg-green-50 text-green-700':'bg-red-50 text-red-600'}`}>
                <span>{ins.type==='ok'?'✅':'⚠️'}</span>
                <span>{ins.msg}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Stats */}
      <div className="grid grid-cols-2 gap-3 mb-4">
        {[
          { l:'Série', v:`${streak}j`, i:'🔥', g:'from-orange-400 to-red-400' },
          { l:'Mots appris', v:totalWords, i:'📖', g:'from-blue-400 to-indigo-400' },
          { l:'Sessions orales', v:totalSessions, i:'🎙️', g:'from-green-400 to-teal-400' },
          { l:'Score moyen', v:totalSessions?`${avgScore.toFixed(1)}/10`:'—', i:'⭐', g:'from-yellow-400 to-orange-400' },
        ].map((s,i) => (
          <div key={i} className="card p-4">
            <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${s.g} flex items-center justify-center text-xl mb-2`}>{s.i}</div>
            <p className="text-xl font-extrabold text-gray-900">{s.v}</p>
            <p className="text-xs text-gray-500">{s.l}</p>
          </div>
        ))}
      </div>

      {/* Per-Teil */}
      <div className="card p-4 mb-4">
        <h3 className="font-bold text-gray-800 mb-3">🎙️ Progression par partie</h3>
        <div className="space-y-3">
          {partScores.map(p => (
            <div key={p.id}>
              <div className="flex justify-between text-xs mb-1">
                <span className="font-medium text-gray-700">{p.emoji} Teil {p.id} — {p.title}</span>
                <span className="font-bold">{p.avg ? `${p.avg.toFixed(1)}/10 · ${p.n} session${p.n>1?'s':''}` : <span className="text-gray-300">Non commencé</span>}</span>
              </div>
              <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                <div className={`h-full bg-gradient-to-r ${p.grad} rounded-full transition-all`} style={{ width:`${p.avg?(p.avg/10)*100:0}%` }} />
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Vocab breakdown */}
      <div className="card p-4 mb-4">
        <h3 className="font-bold text-gray-800 mb-3">📚 Vocabulaire</h3>
        <div className="grid grid-cols-3 gap-2 text-center">
          {[
            { l:'Total', v:totalWords, c:'text-blue-600' },
            { l:'Révisés auj.', v:reviewedToday, c:'text-green-600' },
            { l:'Sujets analysés', v:topics.filter(t=>t.analyzed).length, c:'text-indigo-600' },
          ].map((s,i) => (
            <div key={i} className="bg-gray-50 rounded-xl py-3">
              <p className={`text-2xl font-extrabold ${s.c}`}>{s.v}</p>
              <p className="text-xs text-gray-400">{s.l}</p>
            </div>
          ))}
        </div>
        <div className="mt-3">
          <div className="flex justify-between text-xs mb-1 text-gray-500">
            <span>Progression vers 300 mots B1</span>
            <span className="font-bold">{Math.min(100, Math.round((totalWords/300)*100))}%</span>
          </div>
          <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-blue-400 to-indigo-500 rounded-full" style={{ width:`${Math.min(100,(totalWords/300)*100)}%` }} />
          </div>
        </div>
      </div>

      {/* Session history */}
      {sessions.length>0 && (
        <div className="card p-4">
          <h3 className="font-bold text-gray-800 mb-3">📋 Historique complet</h3>
          <div className="space-y-2 max-h-64 overflow-y-auto">
            {[...sessions].reverse().map((s,i) => (
              <div key={i} className="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
                <span className="text-xl">{s.partId===99?'📝':['🗣️','📋','❓'][s.partId-1]||'🎙️'}</span>
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-medium text-gray-800 truncate">{s.partTitle}</p>
                  <p className="text-xs text-gray-400">{new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · {s.exchanges} échanges</p>
                </div>
                <span className={`font-bold text-sm shrink-0 ${s.score>=7?'text-green-600':s.score>=5?'text-orange-500':'text-red-500'}`}>{s.score.toFixed(1)}/10</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Synchronisation & Sauvegarde (PC <-> Téléphone) */}
      <div className="card p-4 mt-4">
        <h3 className="font-bold text-gray-800 mb-1 flex items-center gap-1.5">
          <span>🔄</span> Synchronisation (PC ↔ Téléphone)
        </h3>
        <p className="text-xs text-gray-500 mb-3 leading-relaxed">
          Transférez tous vos mots sauvegardés, votre clé et vos scores vers votre téléphone en un seul clic !
        </p>

        <div className="flex gap-2">
          <button
            type="button"
            onClick={exportData}
            className="flex-1 gradient-bg text-white font-extrabold text-xs py-2.5 rounded-xl shadow-xs flex items-center justify-center gap-1.5 hover:opacity-95 transition-all"
            title="Télécharger une sauvegarde avec tous vos mots"
          >
            <span>📤</span> Exporter mes données
          </button>

          <input
            ref={fileInputRef}
            type="file"
            accept=".json,application/json"
            onChange={importData}
            className="hidden"
          />

          <button
            type="button"
            onClick={() => fileInputRef.current?.click()}
            className="flex-1 bg-white border border-gray-200 text-gray-800 font-extrabold text-xs py-2.5 rounded-xl hover:bg-gray-50 transition-colors flex items-center justify-center gap-1.5 shadow-xs"
            title="Importer vos mots sur ce téléphone ou PC"
          >
            <span>📥</span> Importer mes données
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   BOTTOM NAV
═══════════════════════════════════════════ */
function BottomNav({ tab, setTab }) {
  const items = [
    { k:'home',    l:'Accueil',    e:'🏠' },
    { k:'vocab',   l:'Vocabulaire',e:'📚' },
    { k:'topics',  l:'Examens',    e:'📝' },
    { k:'profile', l:'Profil',     e:'👤' },
  ];
  return (
    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-16 z-40 bottom-safe" style={{ boxShadow:'0 -2px 16px rgba(0,0,0,.06)' }}>
      {items.map(it => (
        <button key={it.k} onClick={()=>setTab(it.k)}
          className={`flex flex-col items-center gap-0.5 px-4 py-1 transition-colors ${tab===it.k?'text-orange-500':'text-gray-400'}`}>
          <span className="text-2xl">{it.e}</span>
          <span className={`text-xs font-semibold ${tab===it.k?'text-orange-500':'text-gray-400'}`}>{it.l}</span>
          {tab===it.k && <div className="w-5 h-0.5 rounded-full gradient-bg" />}
        </button>
      ))}
    </nav>
  );
}

/* ═══════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════ */
function App() {
  const [apiKey, setApiKey] = useState(() => db.get(K.API, null));
  const [tab, setTab]       = useState('home');

  const handleSaveKey = key => { db.set(K.API, key); setApiKey(key); };
  const handleResetKey = () => { if(confirm('Changer de clé API ?')) { db.set(K.API,null); setApiKey(null); } };

  const handleSessionEnd = session => {
    const sessions = db.get(K.SESSIONS, []);
    db.set(K.SESSIONS, [...sessions, session]);
  };

  const handleVocabExtracted = words => {
    const notebook = db.get(K.NOTEBOOK, []);
    const exist = new Set(notebook.map(w=>(w.de||'').toLowerCase()));
    const fresh = words.filter(w => !exist.has((w.de||'').toLowerCase()));
    if (fresh.length) db.set(K.NOTEBOOK, [...notebook, ...fresh]);
  };

  return (
    <div className="max-w-lg mx-auto min-h-screen bg-gray-50 relative">
      {!apiKey && <SetupModal onSave={handleSaveKey} />}

      <div className="min-h-screen" style={{ paddingBottom:'64px' }}>
        {tab==='home'    && <Dashboard apiKey={apiKey} onSessionEnd={handleSessionEnd} />}
        {tab==='vocab'   && <VocabTab  apiKey={apiKey} />}
        {tab==='topics'  && <TopicsTab apiKey={apiKey} onVocabExtracted={handleVocabExtracted} />}
        {tab==='profile' && <ProfileTab apiKey={apiKey} onResetKey={handleResetKey} />}
      </div>

      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
