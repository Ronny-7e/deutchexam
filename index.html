/* ═══════════════════════════════════════════
   GEMINI API
═══════════════════════════════════════════ */
const GEMINI_MODELS = [
  'gemini-3.5-flash-lite',
  'gemini-3.5-flash',
  'gemini-3.8-flash',
  'gemini-3.1-flash-lite'
];

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function gemini(apiKey, system, history, userMsg, { json = false, temperature = 0.8, audio = null } = {}) {
  const userParts = [];
  if (audio && audio.base64) {
    userParts.push({
      inlineData: {
        mimeType: audio.mimeType || 'audio/webm',
        data: audio.base64,
      },
    });
  }
  if (userMsg) {
    userParts.push({ text: userMsg });
  }

  const contents = [
    ...history.map(m => ({
      role: m.role === 'ai' ? 'model' : 'user',
      parts: [{ text: m.text }],
    })),
    { role: 'user', parts: userParts },
  ];

  const body = {
    system_instruction: { parts: [{ text: system }] },
    contents,
    generationConfig: { temperature, maxOutputTokens: 1200 },
  };

  let lastErr = null;
  for (const model of GEMINI_MODELS) {
    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      );

      const data = await res.json();
      if (data.error) {
        lastErr = new Error(data.error.message);
        continue;
      }
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
      if (json) {
        const m = text.match(/```json\s*([\s\S]*?)```/) || text.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
        if (m) { try { return JSON.parse(m[1] || m[0]); } catch {} }
        throw new Error('JSON parse error');
      }
      return text;
    } catch (e) {
      lastErr = e;
    }
  }

  throw lastErr || new Error('Erreur lors de la communication avec Gemini');
}

/* Parse [PARTNER]…[/PARTNER][FEEDBACK]{…}[/FEEDBACK] */
function parseChat(raw) {
  const pm = raw.match(/\[PARTNER\]([\s\S]*?)\[\/PARTNER\]/);
  const fm = raw.match(/\[FEEDBACK\]([\s\S]*?)\[\/FEEDBACK\]/);
  let partner = pm ? pm[1].trim() : '';
  let feedback = null;
  if (fm) {
    let fStr = fm[1].trim();
    fStr = fStr.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
    try {
      feedback = JSON.parse(fStr);
    } catch {
      const jm = fStr.match(/\{[\s\S]*\}/);
      if (jm) {
        try { feedback = JSON.parse(jm[0]); } catch {}
      }
    }
  }
  if (!partner) {
    partner = raw.replace(/\[FEEDBACK\][\s\S]*?\[\/FEEDBACK\]/g, '').replace(/\[\/?PARTNER\]/g, '').trim();
  }
  return { partner: partner || raw.trim(), feedback };
}

/* ═══════════════════════════════════════════
   AUDIO RECORDER & SPEECH SYNTHESIS
═══════════════════════════════════════════ */
function speakGerman(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/\[\/?(PARTNER|FEEDBACK)\]/g, '').replace(/[«»"]/g, '').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'de-DE';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function useVoiceRecorder() {
  const [recording, setRecording]     = useState(false);
  const [recordSecs, setRecordSecs]   = useState(0);
  const [audioBlob, setAudioBlob]     = useState(null);
  const [audioUrl, setAudioUrl]       = useState(null);
  const [transcript, setTranscript]   = useState('');
  const [micError, setMicError]       = useState(null);
  
  const mediaRecorderRef = useRef(null);
  const chunksRef        = useRef([]);
  const timerRef         = useRef(null);
  const speechRef        = useRef(null);

  /* Detect the best supported MIME type for this device */
  const getBestMimeType = useCallback(() => {
    if (!window.MediaRecorder) return '';
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/ogg;codecs=opus',
      'audio/ogg',
      'audio/wav',
      '',
    ];
    for (const mime of candidates) {
      if (!mime) return '';
      try {
        if (MediaRecorder.isTypeSupported(mime)) return mime;
      } catch { /* ignore */ }
    }
    return '';
  }, []);

  /* Request microphone permission explicitly (needed on mobile HTTPS) */
  const requestMicPermission = useCallback(async () => {
    /* 1. Check Permissions API if available */
    if (navigator.permissions && navigator.permissions.query) {
      try {
        const status = await navigator.permissions.query({ name: 'microphone' });
        if (status.state === 'denied') {
          throw new Error('DENIED');
        }
      } catch (e) {
        if (e.message === 'DENIED') throw e;
        /* Permissions API not supported for microphone on this browser — continue */
      }
    }
    /* 2. Check that mediaDevices is available (HTTPS required) */
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('NO_MEDIA_DEVICES');
    }
    /* 3. Actually request */
    return navigator.mediaDevices.getUserMedia({ audio: true });
  }, []);

  const start = useCallback(async () => {
    setMicError(null);
    try {
      let stream;
      try {
        stream = await requestMicPermission();
      } catch (permErr) {
        if (permErr.message === 'DENIED') {
          setMicError('denied');
          alert("⚠️ L'accès au microphone est bloqué.\n\nAllez dans les Paramètres de votre navigateur → Autorisations du site → Microphone → Autoriser ce site.\n\nSur iPhone : Réglages → Safari → Microphone → Autoriser.");
          return;
        }
        if (permErr.message === 'NO_MEDIA_DEVICES') {
          setMicError('https');
          alert("⚠️ Le microphone n'est pas disponible.\n\nCette fonctionnalité nécessite une connexion HTTPS sécurisée.\nVérifiez que vous utilisez bien https:// dans l'URL (pas http://).\n\nSur GitHub Pages, l'URL doit commencer par https://");
          return;
        }
        /* Other error (NotAllowedError, NotFoundError, etc.) */
        const msg = permErr.name === 'NotAllowedError'
          ? "Vous avez refusé l'accès au micro. Rafraîchissez la page et acceptez la demande d'autorisation."
          : permErr.name === 'NotFoundError'
          ? "Aucun microphone détecté sur cet appareil."
          : permErr.name === 'NotReadableError'
          ? "Le micro est utilisé par une autre application. Fermez les autres apps et réessayez."
          : "Erreur d'accès au micro : " + (permErr.message || permErr.name);
        setMicError('error');
        alert("⚠️ " + msg);
        return;
      }

      chunksRef.current = [];

      const mimeType = getBestMimeType();

      let recorder;
      try {
        recorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);
      } catch (recErr) {
        /* Safari sometimes fails with specific MIME types — fallback */
        console.warn('MediaRecorder creation failed with mimeType:', mimeType, recErr);
        recorder = new MediaRecorder(stream);
      }
      mediaRecorderRef.current = recorder;

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunksRef.current.push(e.data);
      };

      recorder.onstop = () => {
        const type = recorder.mimeType || mimeType || 'audio/webm';
        const blob = new Blob(chunksRef.current, { type });
        const url  = URL.createObjectURL(blob);
        setAudioBlob(blob);
        setAudioUrl(url);
        stream.getTracks().forEach(t => t.stop());
      };

      recorder.onerror = (e) => {
        console.error('MediaRecorder error:', e);
        stream.getTracks().forEach(t => t.stop());
        setRecording(false);
        if (timerRef.current) clearInterval(timerRef.current);
      };

      /* Use timeslice of 250ms for more frequent data chunks (better for mobile) */
      recorder.start(250);
      setRecording(true);
      setRecordSecs(0);
      setAudioBlob(null);
      setAudioUrl(null);
      setTranscript('');

      timerRef.current = setInterval(() => {
        setRecordSecs(s => s + 1);
      }, 1000);

      // Web Speech API in parallel for live German transcription
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        try {
          const rec = new SR();
          rec.lang = 'de-DE';
          rec.continuous = true;
          rec.interimResults = true;
          rec.onresult = e => {
            const t = Array.from(e.results).map(r => r[0].transcript).join('');
            setTranscript(t);
          };
          rec.onerror = e => {
            console.warn('SpeechRecognition error:', e.error);
            /* Don't block — speech recognition is optional */
          };
          speechRef.current = rec;
          rec.start();
        } catch (e) {
          console.warn('SpeechRecognition init error:', e);
        }
      }
    } catch (err) {
      console.error('Voice recorder start failed:', err);
      setMicError('error');
      alert("Impossible d'accéder au microphone : " + err.message);
    }
  }, [requestMicPermission, getBestMimeType]);

  const stop = useCallback(() => {
    if (timerRef.current) clearInterval(timerRef.current);
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
      mediaRecorderRef.current.stop();
    }
    if (speechRef.current) {
      try { speechRef.current.stop(); } catch {}
    }
    setRecording(false);
  }, []);

  const reset = useCallback(() => {
    setAudioBlob(null);
    setAudioUrl(null);
    setRecordSecs(0);
    setTranscript('');
  }, []);

  return {
    recording,
    recordSecs,
    audioBlob,
    audioUrl,
    transcript,
    micError,
    setTranscript,
    start,
    stop,
    reset,
  };
}

/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */
function SetupModal({ onSave }) {
  const [key, setKey]     = useState('');
  const [busy, setBusy]   = useState(false);
  const [err, setErr]     = useState('');

  const validate = async () => {
    if (!key.trim()) { setErr('Veuillez entrer une clé API.'); return; }
    setBusy(true); setErr('');
    try {
      await gemini(key.trim(), 'Respond in one word.', [], 'Say: ok');
      db.set(K.API, key.trim());
      onSave(key.trim());
    } catch (e) {
      setErr('Clé invalide ou erreur réseau : ' + e.message);
    } finally { setBusy(false); }
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="card p-6 w-full max-w-sm fade-in">
        <div className="text-center mb-5">
          <div className="text-5xl mb-2">🔑</div>
          <h2 className="text-xl font-extrabold text-gray-900">Connecter l'IA Gemini</h2>
          <p className="text-sm text-gray-500 mt-1">Nécessaire pour le partenaire oral et l'analyse de sujets</p>
        </div>

        <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-xs text-amber-800 space-y-1">
          <p className="font-bold">📋 Clé API gratuite (30 secondes) :</p>
          <p>1. Ouvrez <a href="https://aistudio.google.com/apikey" target="_blank" className="underline font-semibold">aistudio.google.com/apikey</a></p>
          <p>2. Cliquez <strong>« Create API key »</strong></p>
          <p>3. Copiez et collez ci-dessous 👇</p>
        </div>

        <input
          value={key} onChange={e => setKey(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && validate()}
          placeholder="AIzaSy..."
          type="password"
          className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm font-mono outline-none focus:border-orange-400 transition-colors"
        />
        {err && <p className="text-red-500 text-xs mt-2 font-medium">{err}</p>}

        <button
          onClick={validate} disabled={busy}
          className="gradient-bg w-full text-white font-bold py-3 rounded-xl mt-4 text-sm disabled:opacity-60 transition-opacity"

          Votre clé reste stockée localement, jamais partagée.
        </p>

    </div>
  );
}

    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [msgs, loading, voice.recording, voice.audioUrl]);

  const send = async (content, audioUrlToSend = null, audioBlobToSend = null) => {
    const t = (content || '').trim();
    if (!t && !audioUrlToSend && !audioBlobToSend) return;
    if (loading) return;

    if (voice.recording) voice.stop();
    setTextInput('');
    const finalAudioUrl = audioUrlToSend;
    const finalAudioBlob = audioBlobToSend;
    voice.reset();

    const userMsg = {
      role: 'user',
      text: t || '🎙️ (Message vocal en cours d\'analyse…)',
      audioUrl: finalAudioUrl,
      id: uid(),
    };
    setMsgs(prev => [...prev, userMsg]);
    setLoading(true);

    try {
      let audioPayload = null;
      if (finalAudioBlob) {
        try {
          const b64 = await blobToBase64(finalAudioBlob);
          const cleanMime = (finalAudioBlob.type || 'audio/webm').split(';')[0].trim() || 'audio/webm';
          audioPayload = {
            mimeType: cleanMime,
            base64: b64,
          };
        } catch (err) {
          console.warn('Erreur conversion audio en base64:', err);
        }
      }

      const history = msgs.slice(-10).map(m => ({ role: m.role, text: m.text }));
      let userPrompt = '';
      if (audioPayload) {
        userPrompt = t
          ? `[Sprachnachricht als Audio angehängt. Vorläufige Erkennung: "${t}"]. Bitte höre das beigefügte Audio ganz genau an: Transkribiere das wirklich Gesprochene auf Deutsch, beurteile Aussprache (Laute, Betonung, Rhythmus) und Grammatik im FEEDBACK auf Französisch, und antworte auf Deutsch als Prüfungspartnerin Anna im PARTNER-Abschnitt.`
          : `[Sprachnachricht als Audio angehängt]. Bitte höre das beigefügte Audio ganz genau an: Transkribiere das Gesprochene auf Deutsch, bewerte Aussprache (Laute, Betonung, Rhythmus) und Grammatik im FEEDBACK auf Französisch, und antworte auf Deutsch als Prüfungspartnerin Anna im PARTNER-Abschnitt.`;
      } else {
        userPrompt = t;
      }

      const raw = await gemini(apiKey, part.system, history, userPrompt, { audio: audioPayload });
      const { partner, feedback } = parseChat(raw);

      if (feedback?.score) setScores(s => [...s, Number(feedback.score)]);

      setMsgs(prev => {
        const updated = [...prev];
        const last = updated[updated.length - 1];
        if (last && last.role === 'user' && last.id === userMsg.id) {
          const finalDisplay = feedback?.transcription
            ? feedback.transcription
            : (t || '🎙️ Message vocal');
          updated[updated.length - 1] = {
            ...last,
            text: finalDisplay,
            feedback,
          };
        }
        return [...updated, { role: 'ai', text: partner, id: uid() }];
      });

      // Ouvrir automatiquement le feedback pour que l'étudiant voie les corrections
      setOpenFB(p => ({ ...p, [userMsg.id]: true }));
    } catch (e) {
      setMsgs(prev => [...prev, { role: 'ai', text: `⚠️ Erreur : ${e.message}`, id: uid() }]);
    } finally {
      setLoading(false);
    }
  };

  const finish = () => {
    if (voice.recording) voice.stop();
    voice.reset();
    if (scores.length > 0) {
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      onSessionEnd({ partId: part.id, partTitle: part.title, score: avg, exchanges: scores.length, date: new Date().toISOString() });
    }
    onBack();
  };

  const saveFeedbackPhrase = (msgId, phrase) => {
    const notebook = db.get(K.NOTEBOOK, []);
    const clean = phrase.replace(/[«»"]/g, '').trim();
    if (!clean) return;
    const exists = notebook.some(w => (w.de || '').toLowerCase() === clean.toLowerCase());
    if (!exists) {
      const newWord = {
        id: uid(),
        de: clean,
        fr: 'Expression vue en simulation orale (Teil ' + part.id + ')',
        cat: 'Expression',
        plural: '',
        example: clean,
        addedAt: Date.now(),
        reviewCount: 0,
        source: 'oral',
        lastReviewed: null,
      };
      db.set(K.NOTEBOOK, [newWord, ...notebook]);
    }
    setSavedPhrases(p => ({ ...p, [msgId]: true }));
  };

  const avgScore = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : null;

  return (
    <div className="fixed inset-0 z-50 bg-gray-50 flex flex-col fade-in">
      {/* Header */}
      <div className="shrink-0 flex items-center gap-3 px-4 py-3 bg-white border-b shadow-sm">
        <button onClick={finish} className="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center shrink-0 transition-colors">
          <svg className="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${part.grad} flex items-center justify-center text-xl shrink-0 shadow-sm`}>{part.emoji}</div>
        <div className="flex-1 min-w-0">
          <p className="font-bold text-gray-900 text-sm truncate">Teil {part.id} — {part.title}</p>
          <div className="flex items-center gap-2">
            <span className="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span className="text-xs text-gray-500">Prüfungspartnerin Anna</span>
          </div>
        </div>
        {avgScore && (
          <div className="text-right shrink-0 bg-orange-50 border border-orange-200 px-2.5 py-1 rounded-xl">
            <p className="text-[10px] uppercase font-bold text-orange-600 tracking-wider">Moyenne</p>
            <p className={`font-extrabold text-sm ${Number(avgScore)>=7?'text-green-600':Number(avgScore)>=5?'text-orange-500':'text-red-500'}`}>{avgScore}/10</p>
          </div>
        )}
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
        {msgs.map((m) => (
          <div key={m.id} className={`flex ${m.role==='user'?'justify-end':'justify-start'} fade-in`}>
            <div className="max-w-[85%]">
              {m.role === 'ai' && (
                <div className="flex items-center justify-between mb-1 ml-1 text-xs text-gray-400">
                  <span className="font-semibold flex items-center gap-1">🤖 Anna (Examinatrice B1)</span>
                  <button
                    onClick={() => speakGerman(m.text)}
                    className="text-[11px] text-orange-600 hover:text-orange-800 font-bold flex items-center gap-1 bg-orange-50 px-2 py-0.5 rounded-md"
                    title="Écouter la prononciation allemande d'Anna"
                  >
                    🔊 Écouter Anna
                  </button>
                </div>
              )}

              <div className={m.role==='user'?'bubble-user p-3.5 shadow-sm':'bubble-ai p-3.5 shadow-sm border border-gray-100'}>
                {/* If user recorded audio, display the audio player in the message! */}
                {m.audioUrl && (
                  <div className="mb-2 bg-black/10 rounded-xl p-2.5 border border-white/20">
                    <p className="text-[11px] font-extrabold uppercase tracking-wider mb-1.5 opacity-90 flex items-center gap-1.5">
                      <span>🎙️</span> Votre enregistrement vocal brut :
                    </p>
                    <audio controls src={m.audioUrl} className="w-full h-8 rounded-lg" />
                  </div>
                )}
                <p className="text-sm leading-relaxed whitespace-pre-wrap">{m.text}</p>
              </div>

              {m.feedback && (
                <div className="mt-2 ml-1">
                  <button
                    onClick={() => setOpenFB(p => ({ ...p, [m.id]: !p[m.id] }))}
                    className="text-xs font-bold text-orange-600 bg-orange-50 border border-orange-200 px-3 py-1.5 rounded-lg flex items-center gap-2 hover:bg-orange-100 transition-colors shadow-xs"
                  >
                    <span>{openFB[m.id] ? '▼' : '▶'}</span>
                    <span>Évaluation & Correction Sprechen</span>
                    {m.feedback.score && (
                      <span className={`px-2 py-0.5 rounded-full text-xs font-extrabold ${Number(m.feedback.score)>=7?'bg-green-100 text-green-700':Number(m.feedback.score)>=5?'bg-orange-200 text-orange-800':'bg-red-100 text-red-600'}`}>
                        {m.feedback.score}/10
                      </span>
                    )}
                  </button>

                  {openFB[m.id] && (
                    <div className="mt-2 bg-amber-50/90 border border-amber-200 rounded-2xl p-3.5 text-xs space-y-3 fade-in shadow-sm">
                      {/* Transcription de ce que l'examinatrice a entendu */}
                      {m.feedback.transcription && (
                        <div className="bg-white p-2.5 rounded-xl border border-amber-200">
                          <p className="font-extrabold text-amber-900 mb-1 flex items-center gap-1.5">
                            <span>👂</span> Ce que l'examinatrice a entendu dans votre audio :
                          </p>
                          <p className="text-gray-900 italic font-medium pl-2 border-l-2 border-amber-400">
                            « {m.feedback.transcription} »
                          </p>
                        </div>
                      )}

                      {/* Prononciation & Intonation */}
                      {m.feedback.pronunciation && (
                        <div className="bg-white p-2.5 rounded-xl border border-blue-200">
                          <p className="font-extrabold text-blue-900 mb-1 flex items-center gap-1.5">
                            <span>🗣️</span> Prononciation & Intonation :
                          </p>
                          <p className="text-gray-800 pl-2 border-l-2 border-blue-400 leading-relaxed">
                            {m.feedback.pronunciation}
                          </p>
                        </div>
                      )}

                      {/* Grammaire & Structure B1 */}
                      {m.feedback.grammar && (
                        <div className="bg-white p-2.5 rounded-xl border border-red-200">
                          <p className="font-extrabold text-red-900 mb-1 flex items-center gap-1.5">
                            <span>⚠️</span> Grammaire & Structure de phrase :
                          </p>
                          <p className="text-gray-800 pl-2 border-l-2 border-red-400 leading-relaxed">
                            {m.feedback.grammar}
                          </p>
                        </div>
                      )}

                      {/* Tournure B1 naturelle avec bouton Écouter et bouton Ajouter */}
                      {m.feedback.suggestion && (
                        <div className="bg-gradient-to-r from-green-50 to-emerald-50 p-3 rounded-xl border border-green-300">
                          <p className="font-extrabold text-green-900 mb-1 flex items-center gap-1.5">
                            <span>💡</span> Tournure B1 plus naturelle / Modèle :
                          </p>
                          <p className="text-gray-900 font-semibold italic text-sm pl-2 border-l-2 border-green-500 mb-2.5">
                            « {m.feedback.suggestion} »
                          </p>
                          <div className="flex flex-wrap gap-2">
                            <button
                              onClick={() => speakGerman(m.feedback.suggestion)}
                              className="text-xs bg-white hover:bg-gray-100 text-gray-800 font-bold px-2.5 py-1.5 rounded-lg border border-gray-200 flex items-center gap-1 shadow-xs transition-colors"
                            >
                              🔊 Écouter la prononciation
                            </button>
                            <button
                              onClick={() => saveFeedbackPhrase(m.id, m.feedback.suggestion)}
                              className={`text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all shadow-xs ${
                                savedPhrases[m.id]
                                  ? 'bg-green-600 text-white'
                                  : 'gradient-bg text-white hover:opacity-90'
                              }`}
                            >
                              {savedPhrases[m.id] ? '✅ Ajouté au bloc-notes !' : '➕ Ajouter au bloc-notes'}
                            </button>
                          </div>
                        </div>
                      )}

                      {/* Points forts */}
                      {m.feedback.strengths && (
                        <div className="bg-white/80 p-2 rounded-lg border border-emerald-200">
                          <span className="font-bold text-emerald-800">✅ Points forts : </span>
                          <span className="text-gray-800">{Array.isArray(m.feedback.strengths) ? m.feedback.strengths.join(' · ') : m.feedback.strengths}</span>
                        </div>
                      )}

                      {/* Points à améliorer */}
                      {m.feedback.improvements && (
                        <div className="bg-white/80 p-2 rounded-lg border border-purple-200">
                          <span className="font-bold text-purple-800">📈 Conseils pour l'examen : </span>
                          <span className="text-gray-800">{Array.isArray(m.feedback.improvements) ? m.feedback.improvements.join(' · ') : m.feedback.improvements}</span>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        ))}

        {loading && (
          <div className="flex justify-start fade-in">
            <div className="bubble-ai px-4 py-3 flex items-center gap-2 shadow-sm">
              <span className="text-xs text-orange-600 font-semibold animate-pulse">
                🎙️ Anna écoute votre vocal brut, analyse la prononciation et prépare sa réponse…
              </span>
              <div className="flex gap-1">
                {[0,1,2].map(i => (
                  <div key={i} className="w-2 h-2 bg-orange-400 rounded-full dot-bounce" style={{ animationDelay: `${i*0.15}s` }} />
                ))}
              </div>
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      {/* Input Bar & Voice Recording Preview */}
      <div className="shrink-0 bg-white border-t p-3 shadow-lg z-20">
        {/* CASE 1: Active recording in progress */}
        {voice.recording && (
          <div className="flex items-center justify-between gap-3 bg-red-50 border border-red-200 p-3 rounded-2xl fade-in animate-pulse">
            <div className="flex items-center gap-2.5">
              <span className="w-3.5 h-3.5 rounded-full bg-red-500 animate-ping"></span>
              <div>
                <p className="font-extrabold text-sm text-red-700">Enregistrement audio en cours ({voice.recordSecs}s)</p>
                <p className="text-xs text-red-500">Parlez en allemand… appuyez sur Arrêter pour réécouter</p>
              </div>
            </div>
            <button
              onClick={voice.stop}
              className="bg-red-600 hover:bg-red-700 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-md flex items-center gap-1.5 shrink-0"
            >
              <span>⏹️</span> Arrêter
            </button>
          </div>
        )}

        {/* CASE 2: Audio recorded, WAITING in Preview Mode (User listens to their recording before sending!) */}
        {!voice.recording && voice.audioUrl && (
          <div className="bg-orange-50/80 border border-orange-200 p-3.5 rounded-2xl fade-in space-y-2.5 shadow-sm">
            <div className="flex items-center justify-between">
              <p className="font-extrabold text-xs text-orange-950 flex items-center gap-1.5">
                <span>🎧</span> Réécoutez votre enregistrement ({voice.recordSecs}s) :
              </p>
              <span className="text-[11px] font-bold text-orange-700 bg-orange-100 px-2 py-0.5 rounded-md">
                Prêt pour analyse brute
              </span>
            </div>

            {/* Real audio player so user can listen to their own voice! */}
            <audio controls src={voice.audioUrl} className="w-full h-9 rounded-lg" />

            {/* Transcription preview with editing capability */}
            <div>
              <label className="text-[11px] font-bold text-gray-600 block mb-1">
                Texte détecté en direct (optionnel — l'IA analysera directement le son de votre voix) :
              </label>
              <input
                type="text"
                value={voice.transcript}
                onChange={e => voice.setTranscript(e.target.value)}
                placeholder="Votre phrase en allemand (ex: Ich heiße Alex...)"
                className="w-full bg-white border border-orange-200 rounded-xl px-3 py-2 text-sm text-gray-900 outline-none focus:ring-2 focus:ring-orange-300 font-medium"
              />
            </div>

            {/* Action buttons: Re-record vs Send to AI */}
            <div className="flex gap-2 pt-1">
              <button
                type="button"
                onClick={voice.reset}
                className="flex-1 bg-white hover:bg-gray-100 text-gray-700 border border-gray-200 font-extrabold text-xs py-2.5 rounded-xl flex items-center justify-center gap-1.5 transition-colors"
              >
                <span>🔄</span> Réenregistrer
              </button>
              <button
                type="button"
                onClick={() => send(voice.transcript, voice.audioUrl, voice.audioBlob)}
                disabled={loading}
                className="flex-1 gradient-bg hover:opacity-95 text-white font-extrabold text-xs py-2.5 rounded-xl shadow-md flex items-center justify-center gap-1.5 transition-all disabled:opacity-50"
              >
                <span>🚀</span> Envoyer à l'IA
              </button>
            </div>
          </div>
        )}

        {/* CASE 3: Normal idle state (Mic button + text input) */}
        {!voice.recording && !voice.audioUrl && (
          <div>
            {/* Mic error banner */}
            {voice.micError && (
              <div className={`mb-2 p-2.5 rounded-xl text-xs font-semibold flex items-start gap-2 fade-in ${
                voice.micError === 'denied' ? 'bg-red-50 border border-red-200 text-red-700' :
                voice.micError === 'https'  ? 'bg-yellow-50 border border-yellow-200 text-yellow-800' :
                'bg-orange-50 border border-orange-200 text-orange-700'
              }`}>
                <span className="text-base shrink-0">{voice.micError === 'denied' ? '🚫' : voice.micError === 'https' ? '🔒' : '⚠️'}</span>
                <div>
                  {voice.micError === 'denied' && (
                    <>
                      <p className="font-bold">Microphone bloqué</p>
                      <p className="font-normal mt-0.5">Allez dans les paramètres de votre navigateur → Autorisations → Microphone → Autoriser ce site. Puis rafraîchissez la page.</p>
                    </>
                  )}
                  {voice.micError === 'https' && (
                    <>
                      <p className="font-bold">HTTPS requis pour le micro</p>
                      <p className="font-normal mt-0.5">Le micro ne fonctionne que sur des sites sécurisés (https://). Vérifiez l'URL de la page.</p>
                    </>
                  )}
                  {voice.micError === 'error' && (
                    <>
                      <p className="font-bold">Erreur microphone</p>
                      <p className="font-normal mt-0.5">Vérifiez qu'un micro est connecté et qu'aucune autre app ne l'utilise. Puis réessayez.</p>
                    </>
                  )}
                </div>
              </div>
            )}
            <div className="flex items-center gap-2">
            {/* Record Voice Button */}
            <button
              type="button"
              onClick={voice.start}
              className="px-3.5 py-2.5 rounded-full bg-orange-100 hover:bg-orange-200 text-orange-800 font-extrabold text-xs flex items-center gap-1.5 shrink-0 transition-colors shadow-xs"
              title="Enregistrer un message vocal"
            >
              <span className="text-base">🎙️</span>
              <span>Parler</span>
            </button>

            {/* Or type text */}
            <div className="flex-1 relative flex items-center">
              <input
                type="text"
                value={textInput}
                onChange={e => setTextInput(e.target.value)}
                onKeyDown={e => {
                  if (e.key === 'Enter' && !loading && textInput.trim()) {
                    e.preventDefault();
                    send(textInput);
                  }
                }}
                placeholder="Ou écrivez votre réponse en allemand…"
                className="w-full rounded-full pl-4 pr-9 py-2.5 text-sm outline-none bg-gray-100 focus:bg-white text-gray-900 border border-gray-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-200 transition-all"
              />
              {textInput && (
                <button
                  type="button"
                  onClick={() => setTextInput('')}
                  className="absolute right-3 w-5 h-5 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-500 flex items-center justify-center text-xs font-bold"
                  title="Effacer"
                >
                  ✕
                </button>
              )}
            </div>

            {/* Send button for text */}
            <button
              type="button"
              onClick={() => send(textInput)}
              disabled={loading || !textInput.trim()}
              className="w-11 h-11 rounded-full gradient-bg flex items-center justify-center shrink-0 text-white shadow-md hover:shadow-lg disabled:opacity-40 disabled:cursor-not-allowed transition-all"
              title="Envoyer le texte"
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Dashboard({ apiKey, onSessionEnd }) {
  const [chat, setChat] = useState(null);
  const sessions = db.get(K.SESSIONS, []);

  if (chat) {
    return (
      <ChatInterface
        part={chat} apiKey={apiKey}
        onBack={() => setChat(null)}
        onSessionEnd={s => { onSessionEnd(s); setChat(null); }}
      />
    );
  }

  return (
    <div className="p-4 pb-28 fade-in">
      <h1 className="text-xl font-extrabold text-gray-900 mb-0.5">Guten Tag, Rony! 👋</h1>
      <p className="text-sm text-gray-500 mb-4">Prêt pour l'entraînement B1 ?</p>
      <CountdownBanner />

      <h2 className="text-base font-bold text-gray-800 mb-3">🎙️ Sprechen — Simulation d'oral</h2>
      <div className="space-y-3 mb-6">
        {PARTS.map(p => {
          const ps = sessions.filter(s => s.partId === p.id);
          const avg = ps.length ? (ps.reduce((a,b)=>a+b.score,0)/ps.length).toFixed(1) : null;
          return (
            <button key={p.id} onClick={() => setChat(p)}
              className="card w-full p-4 flex items-center gap-4 text-left hover:scale-[1.01] active:scale-[.99] transition-transform">
              <div className={`w-14 h-14 rounded-xl bg-gradient-to-br ${p.grad} flex items-center justify-center text-2xl shrink-0`}>{p.emoji}</div>
              <div className="flex-1 min-w-0">
                <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Teil {p.id}</p>
                <p className="font-bold text-gray-900">{p.title}</p>
                <p className="text-xs text-gray-500">{p.sub}</p>
              </div>
              <div className="text-right shrink-0">
                {avg
                  ? <><p className="text-xs text-gray-400">Moy.</p><p className={`font-bold ${Number(avg)>=7?'text-green-600':Number(avg)>=5?'text-orange-500':'text-red-500'}`}>{avg}/10</p></>
                  : <span className="text-xs text-gray-300 italic">Pas encore</span>}
              </div>
            </button>
          );
        })}
      </div>

      {sessions.length > 0 && (
        <>
          <h2 className="text-base font-bold text-gray-800 mb-3">📈 Dernières sessions</h2>
          <div className="space-y-2">
            {[...sessions].reverse().slice(0,4).map((s,i) => (
              <div key={i} className="card p-3 flex items-center gap-3">
                <span className="text-2xl">{s.partId===99?'📝':['🗣️','📋','❓'][s.partId-1]||'🎙️'}</span>
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-semibold text-gray-800 truncate">{s.partTitle}</p>
                  <p className="text-xs text-gray-400">{new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</p>
                </div>
                <span className={`font-bold text-sm ${s.score>=7?'text-green-600':s.score>=5?'text-orange-500':'text-red-500'}`}>{s.score.toFixed(1)}/10</span>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}
